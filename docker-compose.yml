services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nextzy
      POSTGRES_PASSWORD: nextzy
      POSTGRES_DB: nextzy
    ports:
      - "5432:5432"
    volumes:
      - nextzy-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextzy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nextzy-data:
